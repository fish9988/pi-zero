name: Release Windows (Pi Zero)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.8; defaults to v<package.json version>)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build & Publish Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ZCODE_ENV: production
      ZCODE_PREVIEW_IDENTITY: "0"
      ZCODE_AUTO_UPDATE: "1"
      ZCODE_UPDATE_PROVIDER: github
      ZCODE_UPDATE_GITHUB_REPO: ${{ github.repository }}
      ZCODE_UPDATE_ALLOW_UNSIGNED_WINDOWS: "1"
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

    steps:
      - name: Disable Git CRLF conversion
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Electron & electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-win-x64-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-win-x64-

      - name: Resolve release version & tag
        id: meta
        shell: pwsh
        run: |
          $pkg = Get-Content -Raw package.json | ConvertFrom-Json
          $version = $pkg.version
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.tag }}" -ne "") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "v$version"
          }
          if ($tag -ne "v$version") {
            throw "Release tag ($tag) does not match package.json version (v$version)."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved release tag=$tag version=$version"

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build Windows runtime host helpers
        shell: pwsh
        env:
          ZCODE_TARGET_OS: win
          ZCODE_TARGET_ARCH: x64
        run: pnpm --filter @zcode/desktop run prepare:windows-runtime-host

      - name: Build desktop production bundle
        shell: pwsh
        run: pnpm run build:bootstrap

      - name: Package Windows x64 NSIS installer
        shell: pwsh
        run: pnpm --filter @zcode/desktop run bundle -- --os win --arch x64 --skip-prepare --skip-build

      - name: Verify artifacts & generate SHA256SUMS.txt
        shell: pwsh
        working-directory: packages/desktop/dist
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $exe = "PiZero-$version-win-x64.exe"
          $blockmap = "$exe.blockmap"
          $yml = "latest.yml"
          foreach ($f in @($exe, $blockmap, $yml)) {
            if (-not (Test-Path $f)) {
              throw "Missing expected release artifact: $f"
            }
          }
          $lines = foreach ($f in @($exe, $blockmap, $yml)) {
            $hash = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLowerInvariant()
            "$hash  $f"
          }
          [System.IO.File]::WriteAllLines(
            (Join-Path (Get-Location) "SHA256SUMS.txt"),
            $lines,
            (New-Object System.Text.UTF8Encoding($false))
          )
          Get-Content SHA256SUMS.txt

      - name: Publish GitHub Release assets
        shell: pwsh
        working-directory: packages/desktop/dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $version = "${{ steps.meta.outputs.version }}"
          $files = @(
            "PiZero-$version-win-x64.exe",
            "PiZero-$version-win-x64.exe.blockmap",
            "latest.yml",
            "SHA256SUMS.txt"
          )
          $releaseJson = gh release view $tag --repo "${{ github.repository }}" --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; uploading assets with --clobber..."
            gh release upload $tag @files --repo "${{ github.repository }}" --clobber
            $releaseInfo = $releaseJson | ConvertFrom-Json
            if ($releaseInfo.isDraft) {
              Write-Host "Publishing draft release $tag..."
              gh release edit $tag --repo "${{ github.repository }}" --draft=false
            }
          } else {
            Write-Host "Creating GitHub Release $tag..."
            gh release create $tag @files `
              --repo "${{ github.repository }}" `
              --title "Pi Zero $tag" `
              --generate-notes
          }
